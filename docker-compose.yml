services:
  mcpython:
    build: .
    image: mcpython:latest
    container_name: mcpython
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    restart: unless-stopped
